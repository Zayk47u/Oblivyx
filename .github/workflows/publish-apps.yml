name: Publish Feather catalog

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/publish-apps.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feather-catalog
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Validate publisher
        run: python3 -m unittest discover -s tests -v
      - name: Verify and publish app releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_catalog.py
      - name: Commit verified catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-repo.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update verified Feather app catalog'
          git push origin HEAD:main
